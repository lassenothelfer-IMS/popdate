# Publishes Popdate's Terms of Use and Privacy Policy to GitHub Pages
# (https://lassenothelfer-ims.github.io/popdate/). The paywalls and the App
# Store listing link there. The text is the app's own (`legal-screen.tsx`), so
# this runs whenever it changes.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - mobile/src/features/settings/legal-screen.tsx
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
