body{margin:0}
a{color:#5D2355}a:hover{color:#3F1739}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(2){animation-delay:80ms}.pd-root > *:nth-child(3){animation-delay:160ms}.pd-root > *:nth-child(4){animation-delay:240ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:400ms}.pd-root > *:nth-child(7){animation-delay:480ms}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pd-bob{animation:pd-bob 5s ease-in-out infinite;transform-origin:50% 100%}
.pd-bob2{animation:pd-bob 4.2s ease-in-out -1.6s infinite;transform-origin:50% 100%}
.pd-bob3{animation:pd-bob 5.6s ease-in-out -3s infinite;transform-origin:50% 100%}
@keyframes pd-bob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(-1.6deg)}}
.pd-sway{animation:pd-sway 6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pd-sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.pd-ghost{animation:pd-ghost 2.6s ease-in-out infinite}
@keyframes pd-ghost{0%,100%{opacity:.45}50%{opacity:.9}}
.pd-count{animation:pd-count 5s linear both;transform-origin:left center}
@keyframes pd-count{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pd-shred{animation:pd-shred 1.4s cubic-bezier(.22,1,.36,1) 300ms both}
@keyframes pd-shred{from{opacity:0;transform:translate(0,-18px) scale(.6)}to{opacity:1;transform:none}}
.pd-root a[href]{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms}
.pd-root a[href]:active{transform:scale(1.02)}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}
