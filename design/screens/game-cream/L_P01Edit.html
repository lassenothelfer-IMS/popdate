<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Cream: Edit profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}
.pd-lift{animation:pd-lift 2.4s ease-in-out infinite}
@keyframes pd-lift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box"><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between">
    <a href="L_Profile.html" style="font-size: 15px; font-weight: 500; color: #1C1917; text-decoration: none; height: 44px; display: flex; align-items: center">Cancel</a>
    <div style="font-size: 15px; font-weight: 600">Edit profile</div>
    <a href="L_Profile.html" style="font-size: 15px; font-weight: 600; color: #B5332A; text-decoration: none; height: 44px; display: flex; align-items: center">Save</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 126px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 600; color: #5F574F">Photos</span><span style="font-size: 12px; color: #8C8378">Hold and drag to reorder</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, 108px); gap: 10px">
      <div style="grid-column: 1 / 3; grid-row: 1 / 3; position: relative; border-radius: 12px; overflow: hidden; background: #E8D6DF; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08)"><div style="position: absolute; left: -30px; top: 20px; width: 200px; height: 200px; border-radius: 50%; background: #E39AA6; filter: blur(40px); opacity: .6"></div><div style="position: absolute; left: 10px; top: 10px; padding: 4px 9px; border-radius: 999px; background: #1C1917; color: #FFFDFA; font-size: 11px; font-weight: 600">Round 1</div></div>
      <div class="pd-lift" style="position: relative; border-radius: 12px; overflow: hidden; background: #EFE3D0; box-shadow: 0 16px 30px -10px rgba(0,0,0,.7), 0 0 0 2px #1C1917"><div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 40%, rgba(217,174,92,.5), transparent 70%)"></div><div style="position: absolute; left: 8px; top: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(28,25,23,.7); font-size: 10px; font-weight: 600">2</div></div>
      <div style="position: relative; border-radius: 12px; overflow: hidden; background: #DDE4EA"><div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 40%, rgba(143,174,203,.5), transparent 70%)"></div><div style="position: absolute; left: 8px; top: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(28,25,23,.7); font-size: 10px; font-weight: 600">3</div></div>
      <div style="position: relative; border-radius: 12px; overflow: hidden; background: #DFE6DB"><div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 40%, rgba(155,187,143,.5), transparent 70%)"></div><div style="position: absolute; left: 8px; top: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(28,25,23,.7); font-size: 10px; font-weight: 600">4</div></div>
      <div style="position: relative; border-radius: 12px; overflow: hidden; background: #E8DEE6"><div style="position: absolute; inset: 0; background: radial-gradient(circle at 40% 40%, rgba(192,143,179,.5), transparent 70%)"></div><div style="position: absolute; left: 8px; top: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(28,25,23,.7); font-size: 10px; font-weight: 600">5</div></div>
      <button type="button" aria-label="Add photo 6" style="border: 0; border-radius: 12px; background: #E9DDC8; box-shadow: inset 0 0 0 1.5px rgba(28,25,23,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5F574F; font-family: inherit"><svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#5F574F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M14 6v16M6 14h16"></path></svg><span style="font-size: 11px; font-weight: 600">Photo 6</span></button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 516px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="bio" style="font-size: 13px; font-weight: 600; color: #5F574F">Bio</label>
      <textarea id="bio" rows="2" style="border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.14); background: #FFFDFA; padding: 12px 14px; font-size: 16px; line-height: 22px; font-family: inherit; color: #1C1917; box-sizing: border-box; outline: none; resize: none; width: 100%">Slow mornings, fast bikes, and a good argument about pizza.</textarea>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="h" style="font-size: 13px; font-weight: 600; color: #5F574F">Height</label><input id="h" type="text" value="183 cm" style="height: 48px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.14); background: #FFFDFA; padding: 0 14px; font-size: 16px; font-family: inherit; color: #1C1917; box-sizing: border-box; outline: none; width: 100%"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="j" style="font-size: 13px; font-weight: 600; color: #5F574F">Job or school</label><input id="j" type="text" value="Student" style="height: 48px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.14); background: #FFFDFA; padding: 0 14px; font-size: 16px; font-family: inherit; color: #1C1917; box-sizing: border-box; outline: none; width: 100%"></div>
    </div>
    <div style="font-size: 12px; color: #8C8378">Name and birthday can't be changed. Ask us if something is wrong.</div>
  </div>
</div>
</body>
</html>
