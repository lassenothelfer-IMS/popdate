<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Cream: Chooser, you chose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}
.pd-aura{animation:pd-aura 9s ease-in-out infinite alternate}
@keyframes pd-aura{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-20px) scale(1.15)}}
.pd-card{animation:pd-c 1.1s cubic-bezier(.22,1,.36,1) 500ms both}
@keyframes pd-c{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}
.pd-title{animation:pd-t 900ms cubic-bezier(.22,1,.36,1) 1300ms both}
@keyframes pd-t{from{opacity:0;transform:translateY(20px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box"><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div class="pd-aura" style="position: absolute; left: -80px; top: 120px; width: 380px; height: 380px; border-radius: 50%; background: #9BBB8F; filter: blur(90px); opacity: .32"></div>
  <div style="position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 13px; font-weight: 600; color: #5F574F">Your last balloon</div>

  <div class="pd-card" style="position: absolute; left: 70px; top: 130px; width: 250px; height: 340px; border-radius: 22px; overflow: hidden; background: #DFE6DB; box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(28,25,23,0.14)">
    <div style="position: absolute; left: -40px; top: 60px; width: 260px; height: 260px; border-radius: 50%; background: #9BBB8F; filter: blur(50px); opacity: .8"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,25,23,.8), rgba(28,25,23,0) 50%)"></div>
    <div style="position: absolute; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 600">Ben, 25</span><span style="font-size: 13px; color: #5F574F">Zürich, 4 km away</span></div>
  </div>

  <div class="pd-title" style="position: absolute; left: 20px; right: 20px; top: 500px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 44px; line-height: 46px; letter-spacing: -0.02em">You chose Ben.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 22px; color: #5F574F">Four questions, four pops, one person left. Ben knows. The chat is open with everything you two said tonight.</p>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 6px">
    <a href="L_Chat.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #1C1917; color: #FFFDFA; font-size: 17px; font-weight: 600; text-decoration: none">Say something</a>
    <a href="L_Recap.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #5F574F; font-size: 15px; font-weight: 500; text-decoration: none">See the room recap</a>
  </div>
</div>
</body>
</html>
