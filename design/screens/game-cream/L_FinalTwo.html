<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Cream: Final two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}
.pd-l{animation:pd-l 900ms cubic-bezier(.22,1,.36,1) 300ms both}
.pd-r{animation:pd-r 900ms cubic-bezier(.22,1,.36,1) 450ms both}
@keyframes pd-l{from{opacity:0;transform:translateX(-60px) rotate(-10deg)}to{opacity:1;transform:rotate(-4deg)}}
@keyframes pd-r{from{opacity:0;transform:translateX(60px) rotate(10deg)}to{opacity:1;transform:rotate(4deg)}}
.pd-breathe{animation:pd-breathe 3s ease-in-out infinite}
@keyframes pd-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box"><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 1px"><div style="font-size: 15px; font-weight: 600; line-height: 18px">Final two</div><div style="font-size: 12px; color: #5F574F; line-height: 14px">Round 4 of 4, Mia decides</div></div>
    <div style="padding: 7px 12px; border-radius: 999px; background: #E9DDC8; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">0:28</div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 118px; display: flex; gap: 6px">
    <span style="--i: 1; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span><span style="--i: 2; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span><span style="--i: 3; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span><span style="--i: 4; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 150px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; color: #5F574F">Mia asked</div>
    <div style="font-family: 'Fraunces', serif; font-size: 24px; line-height: 30px">What's your most controversial food opinion?</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 270px; height: 360px">
    <div class="pd-l" style="position: absolute; left: 28px; top: 20px; width: 190px; height: 300px; border-radius: 20px; overflow: hidden; background: #E8D6DF; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(28,25,23,0.14); transform: rotate(-4deg)">
      <div style="position: absolute; left: -40px; top: 40px; width: 220px; height: 220px; border-radius: 50%; background: #B25A68; filter: blur(40px); opacity: .7"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,25,23,.85), rgba(28,25,23,0) 55%)"></div>
      <div style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(28,25,23,.55); font-size: 11px; font-weight: 600">Photo 4</div>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 15px; font-weight: 600">You, 18</div><div style="font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; line-height: 17px; color: #1C1917">"Pineapple is fine. Fight me."</div></div>
    </div>
    <div class="pd-r pd-breathe" style="position: absolute; right: 28px; top: 0; width: 190px; height: 300px; border-radius: 20px; overflow: hidden; background: #DFE6DB; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 2px #CF3A2F; transform: rotate(4deg)">
      <div style="position: absolute; left: -40px; top: 60px; width: 220px; height: 220px; border-radius: 50%; background: #587554; filter: blur(40px); opacity: .7"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,25,23,.85), rgba(28,25,23,0) 55%)"></div>
      <div style="position: absolute; left: 12px; top: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(28,25,23,.55); font-size: 11px; font-weight: 600">Photo 4</div>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 15px; font-weight: 600">Ben, 25</div><div style="font-family: 'Fraunces', serif; font-style: italic; font-size: 13px; line-height: 17px; color: #1C1917">"Fondue is soup."</div></div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 650px; padding: 14px 16px; border-radius: 14px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08); display: flex; align-items: center; gap: 12px">
    <span style="width: 36px; height: 36px; border-radius: 50%; background: #E8DEE6; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; color: #7A4A6B">M</span>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Mia is listening to Ben's answer</span><span style="font-size: 12px; color: #5F574F">She has 28 seconds. Then one balloon stays.</span></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="L_Match.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #E9DDC8; color: #1C1917; font-size: 17px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.14)">Waiting for Mia</a>
  </div>
</div>
</body>
</html>
