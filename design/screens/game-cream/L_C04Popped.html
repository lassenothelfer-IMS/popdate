<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cream: Chooser, you popped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}
.pd-hold{animation:pd-hold 2.2s linear both}
@keyframes pd-hold{from{stroke-dashoffset:264}to{stroke-dashoffset:0}}
.pd-ring{position:absolute;left:135px;top:130px;width:120px;height:120px;border-radius:50%;border:3px solid #1C1917;opacity:0;animation:pd-ring 650ms cubic-bezier(.2,.8,.3,1) 2300ms both}
@keyframes pd-ring{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(3.2);border-width:1px}}
.pd-bal{transform-origin:50% 100%;animation:pd-gone 1ms linear 2300ms both}
@keyframes pd-gone{to{opacity:0}}
.pd-after{opacity:0;animation:pd-after 800ms cubic-bezier(.22,1,.36,1) 2700ms both}
@keyframes pd-after{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box"><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 1px"><div style="font-size: 15px; font-weight: 600; line-height: 18px">Round 1 of 4</div><div style="font-size: 12px; color: #5F574F; line-height: 14px">Hold to pop</div></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 160px; height: 320px">
    <div class="pd-ring"></div>
    <svg style="position: absolute; left: 105px; top: 100px" width="180" height="180" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#E9DDC8" stroke-width="3"></circle><circle class="pd-hold" cx="50" cy="50" r="42" fill="none" stroke="#CF3A2F" stroke-width="3" stroke-dasharray="264" stroke-linecap="round" transform="rotate(-90 50 50)"></circle></svg>
    <svg class="pd-bal" width="90" height="110" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; position: absolute; left: 150px; top: 140px;"><defs><radialGradient id="vbDD6A60" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FFC9B6"/><stop offset=".42" stop-color="#DD6A60"/><stop offset="1" stop-color="#6E1A25"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbDD6A60)"/><path d="M52 118h16l-8 12z" fill="#6E1A25"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 500px; text-align: center; font-size: 15px; color: #5F574F">Hold the balloon. Let go to change your mind.</div>

  <div class="pd-after" style="position: absolute; left: 20px; right: 20px; top: 540px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <div style="font-family: 'Fraunces', serif; font-weight: 500; font-size: 36px; line-height: 40px; letter-spacing: -0.02em">You popped Noah.</div>
    <div style="font-size: 15px; color: #5F574F">Four balloons left. Round 2 starts with your next question.</div>
  </div>

  <div class="pd-after" style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <div style="font-size: 13px; font-weight: 600; color: #5F574F">Round 2 in</div>
    <a href="L_C05Final.html" style="font-family: 'Fraunces', serif; font-weight: 300; font-size: 56px; line-height: 56px; color: #1C1917; text-decoration: none; font-variant-numeric: tabular-nums">4</a>
  </div>
</div>
</body>
</html>
