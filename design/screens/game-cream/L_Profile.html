<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Cream: Profile and verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}
.pd-ken{animation:pd-ken 14s ease-in-out infinite alternate}
@keyframes pd-ken{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-8px,-10px)}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box"><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 460px; overflow: hidden; background: #E8D6DF">
    <div class="pd-ken" style="position: absolute; inset: 0">
      <div style="position: absolute; left: -60px; top: 40px; width: 320px; height: 320px; border-radius: 50%; background: #B25A68; filter: blur(60px); opacity: .7"></div>
      <div style="position: absolute; right: -80px; top: 180px; width: 340px; height: 340px; border-radius: 50%; background: #B25A68; filter: blur(70px); opacity: .6"></div>
    </div>
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, #F3E9DA 0%, rgba(28,25,23,.6) 30%, rgba(28,25,23,0) 60%)"></div>
    <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between">
      <a href="L_Main.html" style="width: 40px; height: 40px; border-radius: 50%; background: rgba(28,25,23,.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; text-decoration: none" aria-label="Back"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1C1917" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg></a>
      <a href="L_Profile.html" style="padding: 9px 14px; border-radius: 999px; background: rgba(28,25,23,.45); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); font-size: 13px; font-weight: 600; color: #1C1917; text-decoration: none">Edit</a>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 8px"><h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 40px; line-height: 42px; letter-spacing: -0.02em">Lasse, 18</h1><svg width="20" height="20" viewBox="0 0 14 14" aria-label="Verified" role="img"><circle cx="7" cy="7" r="7" fill="#1C1917"></circle><path d="M4 7l2 2 4-4" fill="none" stroke="#FFFDFA" stroke-width="1.6" stroke-linecap="round"></path></svg></div>
      <div style="font-size: 15px; color: #5F574F">Zürich, 183 cm, Student</div>
    </div>
    <div style="position: absolute; left: 20px; bottom: 110px; display: flex; gap: 5px">
      <span style="width: 22px; height: 3px; border-radius: 2px; background: #1C1917"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: rgba(28,25,23,.4)"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: rgba(28,25,23,.4)"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: rgba(28,25,23,.4)"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: rgba(28,25,23,.4)"></span><span style="width: 8px; height: 3px; border-radius: 2px; background: rgba(28,25,23,.4)"></span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 476px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-family: 'Fraunces', serif; font-style: italic; font-size: 19px; line-height: 25px">"Slow mornings, fast bikes, and a good argument about pizza."</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #E9DDC8; font-size: 13px; font-weight: 500; display: flex; align-items: center">Cycling</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #E9DDC8; font-size: 13px; font-weight: 500; display: flex; align-items: center">Live music</span>
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #E9DDC8; font-size: 13px; font-weight: 500; display: flex; align-items: center">Dogs</span>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 610px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08)">
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 36px; height: 36px; border-radius: 10px; background: #F5E1DC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#B5332A" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 2l6 2.5v4c0 3.5-2.6 6-6 7.5-3.4-1.5-6-4-6-7.5v-4z"></path><path d="M6.5 9l1.8 1.8L11.5 7.5"></path></svg></span><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Selfie verified</span><span style="font-size: 13px; color: #5F574F">Matched to photo 1 on 20 Oct</span></div></div>
      <span style="font-size: 13px; color: #1F7A4C; font-weight: 600">Active</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 12px; border-radius: 14px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Fraunces', serif; font-size: 24px">12</span><span style="font-size: 12px; color: #5F574F">rooms</span></div>
      <div style="padding: 12px; border-radius: 14px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Fraunces', serif; font-size: 24px">3</span><span style="font-size: 12px; color: #5F574F">last balloons</span></div>
      <div style="padding: 12px; border-radius: 14px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08); display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Fraunces', serif; font-size: 24px">2</span><span style="font-size: 12px; color: #5F574F">matches</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; justify-content: space-around; padding: 8px 0; border-radius: 999px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.08)">
    <a href="L_Main.html" aria-label="Home" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="12" height="15" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbA98A8D" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#D8CACC"/><stop offset=".42" stop-color="#8C8378"/><stop offset="1" stop-color="#5F383F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbA98A8D)"/><path d="M52 118h16l-8 12z" fill="#5F383F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg></a>
    <a href="L_Chat.html" aria-label="Chats" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#8C8378" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4h14v9H8l-4 3v-3H3z"></path></svg></a>
    <a href="L_Settings.html" aria-label="Settings" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#1C1917" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="2.5"></circle><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"></path></svg></a>
  </div>
</div>
</body>
</html>
