<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Dark: I want to meet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}
.pd-root > *:nth-child(2){animation-delay:110ms}
.pd-root > *:nth-child(3){animation-delay:180ms}
.pd-root > *:nth-child(4){animation-delay:250ms}
.pd-root > *:nth-child(5){animation-delay:320ms}
.pd-root > *:nth-child(6){animation-delay:390ms}
.pd-root > *:nth-child(7){animation-delay:460ms}
.pd-root > *:nth-child(8){animation-delay:530ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root svg[style*="top: 130px"],.pd-root svg[style*="top: 52px"]{animation:pd-float 5.2s ease-in-out infinite;transform-origin:50% 100%}
.pd-root [style*="transform-origin: top"]{animation:pd-sway 5.2s ease-in-out infinite}
@keyframes pd-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-1.5deg)}}
@keyframes pd-sway{0%,100%{transform:rotate(6deg)}50%{transform:rotate(3deg)}}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both}
.pd-root [style*="height: 3px"]:nth-child(n){animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root [style*="filter: blur"]{animation:pd-drift 9s ease-in-out infinite alternate}
@keyframes pd-drift{to{transform:translate(8px,-10px) scale(1.04)}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
.pd-root input:focus,.pd-root textarea:focus{box-shadow:inset 0 0 0 2px currentColor !important}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-root [style*="background: #2B0D14"][style*="border-radius: 20px"],.pd-root [style*="background: #2B0D14"][style*="border-radius: 16px"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,0.08),0 24px 48px -24px rgba(0,0,0,.7) !important}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse 100% 45% at 50% 62%, #4A1E21 0%, #2E0D14 45%, #1D070E 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 60px; display: flex; gap: 4px">
    <span style="--i: 1; flex: 1; height: 3px; border-radius: 2px; background: #F6EAE6"></span>
    <span style="--i: 2; flex: 1; height: 3px; border-radius: 2px; background: #F6EAE6"></span>
    <span style="--i: 3; flex: 1; height: 3px; border-radius: 2px; background: #F6EAE6"></span>
    <span style="--i: 4; flex: 1; height: 3px; border-radius: 2px; background: #F6EAE6"></span>
    <span style="--i: 5; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
    <span style="--i: 6; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
    <span style="--i: 7; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
    <span style="--i: 8; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
    <span style="--i: 9; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
    <span style="--i: 10; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
  </div>
  <a href="DS09Gender.html" style="position: absolute; left: 20px; top: 80px; display: flex; align-items: center; gap: 4px; height: 44px; font-size: 15px; font-weight: 500; color: #F6EAE6; text-decoration: none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F6EAE6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg>Back
  </a>

  <div style="position: absolute; left: 20px; right: 20px; top: 150px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 34px; letter-spacing: -0.015em">I want to meet</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #D3B5B5">Pick as many as you like. This decides which rooms you walk into.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; border: 0; border-radius: 12px; background: #2B0D14; box-shadow: inset 0 0 0 2px #F6EAE6; font-family: inherit; font-size: 17px; font-weight: 600; color: #F6EAE6; text-align: left"><span>Women</span><span style="width: 20px; height: 20px; border-radius: 6px; background: #F6EAE6; display: flex; align-items: center; justify-content: center"><svg width="11" height="9" viewBox="0 0 11 9" fill="none" stroke="#1D070E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4.5 4 7.5 10 1.5"></path></svg></span></button>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; border: 0; border-radius: 12px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); font-family: inherit; font-size: 17px; font-weight: 500; color: #F6EAE6; text-align: left"><span>Men</span><span style="width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.25)"></span></button>
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 18px; border: 0; border-radius: 12px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); font-family: inherit; font-size: 17px; font-weight: 500; color: #F6EAE6; text-align: left"><span>Non-binary people</span><span style="width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.25)"></span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="font-size: 13px; font-weight: 600; color: #D3B5B5">Age range</div>
        <div style="font-family: 'Fraunces', serif; font-size: 20px">18 to 26</div>
      </div>
      <div style="position: relative; height: 28px">
        <div style="position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 1px; background: #562627"></div>
        <div style="position: absolute; left: 0; width: 38%; top: 13px; height: 2px; background: #F6EAE6"></div>
        <div style="position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: #2B0D14; box-shadow: 0 0 0 2px #F6EAE6"></div>
        <div style="position: absolute; left: calc(38% - 13px); top: 1px; width: 26px; height: 26px; border-radius: 50%; background: #2B0D14; box-shadow: 0 0 0 2px #F6EAE6"></div>
      </div>
      <div style="font-size: 13px; color: #A98A8D">Rooms mix people inside your range. We keep it to a few years either side.</div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="DS11City.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #F6EAE6; color: #1D070E; font-size: 17px; font-weight: 600; text-decoration: none">Continue</a>
  </div>
</div>
</body>
</html>
