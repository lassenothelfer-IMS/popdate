<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Lock screen Live Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-di{animation:pd-di 3s ease-in-out infinite}
@keyframes pd-di{0%,100%{width:126px}50%{width:200px}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0306; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 30%, #4A1E21 0%, #1D070E 55%, #0A0306 100%)"></div>

  <div class="pd-di" style="position: absolute; left: 50%; top: 11px; transform: translateX(-50%); height: 37px; border-radius: 20px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; overflow: hidden">
    <svg width="10" height="13" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; flex-shrink: 0;"><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg>
    <span style="font-size: 12px; font-weight: 600; color: #F6EAE6; white-space: nowrap; margin-left: 8px">3rd in line</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 90px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <div style="font-size: 17px; font-weight: 500; color: #F6EAE6; opacity: 0.9">Monday 26 October</div>
    <div style="font-family: -apple-system, system-ui; font-weight: 300; font-size: 88px; line-height: 90px; letter-spacing: -0.02em">21:08</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 300px; border-radius: 22px; overflow: hidden; background: #1D070E; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), 0 20px 50px -20px rgba(0,0,0,0.8)">
    <svg width="150" height="180" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; position: absolute; right: -40px; top: -30px; opacity: 0.85;"><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg>
    <div style="position: relative; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px"><span class="pd-wm" role="img" aria-label="Popdate" style="font-family: 'Gloock', Georgia, serif; font-weight: 400; letter-spacing: -0.03em; white-space: nowrap; line-height: 1">P<svg viewBox="0 0 120 220" aria-hidden="true" style="width: .52em; height: .953em; vertical-align: -.35em; margin: 0 .01em 0 .02em"><defs><radialGradient id="wmcrim" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 130c-6 20 10 34 2 52s-14 22-4 36" stroke="#E9BE72" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#wmcrim)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/></svg>pdate</span></div>
        <span style="font-size: 12px; color: #D3B5B5">now</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'Fraunces', serif; font-weight: 300; font-size: 56px; line-height: 52px; letter-spacing: -0.03em">3rd</span>
        <span style="font-size: 15px; color: #D3B5B5">in line, Zürich</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1; height: 4px; border-radius: 2px; background: #3B141A; overflow: hidden"><div style="width: 66%; height: 100%; border-radius: 2px; background: #F6EAE6"></div></div>
        <span style="font-size: 12px; color: #D3B5B5; font-variant-numeric: tabular-nums">4 of 6</span>
      </div>
      <div style="font-size: 13px; color: #D3B5B5">We'll buzz twice when your room opens.</div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 500px; padding: 14px 16px; border-radius: 18px; background: rgba(43,13,20,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px">
    <span style="width: 36px; height: 36px; border-radius: 9px; background: #F6EAE6; display: flex; align-items: center; justify-content: center"><svg width="8" height="10" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1"><div style="display: flex; justify-content: space-between"><span style="font-size: 14px; font-weight: 600">Popdate</span><span style="font-size: 12px; color: #D3B5B5">2m ago</span></div><div style="font-size: 14px; color: #F6EAE6">Alina sent a voice reply. 0:12</div></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 90px; display: flex; justify-content: space-between">
    <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(43,13,20,0.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F6EAE6" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7 3h6l1 3h3v11H3V6h3z"></path><circle cx="10" cy="11" r="3"></circle></svg></span>
    <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(43,13,20,0.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F6EAE6" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2" width="8" height="12" rx="4"></rect><path d="M4 10a6 6 0 0 0 12 0M10 16v2"></path></svg></span>
  </div>
  <div style="position: absolute; left: 135px; bottom: 8px; width: 120px; height: 5px; border-radius: 3px; background: #F6EAE6; opacity: 0.9"></div>
  <a href="Role.html" style="position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 13px; color: #A98A8D; text-decoration: none">Swipe up to open Popdate</a>
</div>
</body>
</html>
