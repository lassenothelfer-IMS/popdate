<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Chooser, pick a question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-q{transition:background 160ms,transform 160ms}
.pd-q:active{transform:scale(.985)}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse 100% 45% at 50% 62%, #4A1E21 0%, #2E0D14 45%, #1D070E 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 62px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 1px"><div style="font-size: 15px; font-weight: 600; line-height: 18px">Round 1 of 4</div><div style="font-size: 12px; color: #D3B5B5; line-height: 14px">You're choosing tonight</div></div>
    <a href="Main.html" style="padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #F6EAE6; text-decoration: none; background: #3B141A">Leave</a>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 118px; display: flex; gap: 6px">
    <span style="--i: 1; flex: 1; height: 3px; border-radius: 2px; background: #F6EAE6"></span><span style="--i: 2; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span><span style="--i: 3; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span><span style="--i: 4; flex: 1; height: 3px; border-radius: 2px; background: #562627"></span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 142px; display: flex; justify-content: space-between">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="30" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbE2B566" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FFF3D6"/><stop offset=".42" stop-color="#E2B566"/><stop offset="1" stop-color="#6A4212"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbE2B566)"/><path d="M52 118h16l-8 12z" fill="#6A4212"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Nico</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="30" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbDD6A60" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FFC9B6"/><stop offset=".42" stop-color="#DD6A60"/><stop offset="1" stop-color="#6E1A25"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbDD6A60)"/><path d="M52 118h16l-8 12z" fill="#6E1A25"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Noah</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="30" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbE6A3A2" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FCE0D8"/><stop offset=".42" stop-color="#E6A3A2"/><stop offset="1" stop-color="#7C3341"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbE6A3A2)"/><path d="M52 118h16l-8 12z" fill="#7C3341"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Ben</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="30" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vb8E1430" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#E57A8E"/><stop offset=".42" stop-color="#8E1430"/><stop offset="1" stop-color="#2E020B"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vb8E1430)"/><path d="M52 118h16l-8 12z" fill="#2E020B"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Elias</span></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><svg width="24" height="30" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Luca</span></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 220px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 34px; letter-spacing: -0.015em">Ask them something.</h1>
    <p style="margin: 0; font-size: 14px; line-height: 19px; color: #D3B5B5">All five answer, then you see their next photo.</p>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 310px; display: flex; flex-direction: column">
    <button type="button" class="pd-q" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; margin: 0 -16px; border: 0; border-radius: 14px; background: #3B141A; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); font-family: 'Fraunces', serif; font-size: 19px; line-height: 24px; color: #F6EAE6; text-align: left"><span>What's the last thing that made you laugh really hard?</span><span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #F6EAE6; display: flex; align-items: center; justify-content: center"><svg width="11" height="9" viewBox="0 0 11 9" fill="none" stroke="#1D070E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4.5 4 7.5 10 1.5"></path></svg></span></button>
    <button type="button" class="pd-q" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border: 0; border-bottom: 1px solid rgba(255,255,255,0.08); background: transparent; font-family: 'Fraunces', serif; font-size: 19px; line-height: 24px; color: #F6EAE6; text-align: left"><span>What's a dealbreaker for you?</span></button>
    <button type="button" class="pd-q" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border: 0; border-bottom: 1px solid rgba(255,255,255,0.08); background: transparent; font-family: 'Fraunces', serif; font-size: 19px; line-height: 24px; color: #F6EAE6; text-align: left"><span>What would you do with a free week and no money?</span></button>
    <button type="button" class="pd-q" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border: 0; border-bottom: 1px solid rgba(255,255,255,0.08); background: transparent; font-family: 'Fraunces', serif; font-size: 19px; line-height: 24px; color: #F6EAE6; text-align: left"><span>Your most controversial food opinion?</span></button>
    <button type="button" class="pd-q" style="display: flex; align-items: center; gap: 8px; padding: 14px 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #FF9A8C; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FF9A8C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>Write your own</button>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
