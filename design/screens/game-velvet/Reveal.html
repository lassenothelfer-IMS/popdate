<head>

<title>Reveal, photos bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-bloom{filter:grayscale(1) contrast(1.05);animation:pd-bloom 2.4s cubic-bezier(.22,1,.36,1) 1.1s both}
@keyframes pd-bloom{from{filter:grayscale(1) contrast(1.05)}to{filter:grayscale(0) contrast(1)}}
.pd-mono{filter:grayscale(1) brightness(.85)}
.pd-play span{display:block;width:2.5px;border-radius:2px;background:#F6EAE6;animation:pd-wave 1s ease-in-out infinite}
.pd-play span:nth-child(odd){animation-duration:.8s}.pd-play span:nth-child(3n){animation-delay:.15s}
@keyframes pd-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pd-card{transition:transform 300ms cubic-bezier(.22,1,.36,1)}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
