<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Match, aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-aura{animation:pd-aura 9s ease-in-out infinite alternate}
@keyframes pd-aura{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,-20px) scale(1.15)}}
.pd-aura2{animation:pd-aura2 11s ease-in-out infinite alternate}
@keyframes pd-aura2{from{transform:translate(0,0) scale(1)}to{transform:translate(-40px,30px) scale(1.2)}}
.pd-card1{animation:pd-c1 1.1s cubic-bezier(.22,1,.36,1) 500ms both}
.pd-card2{animation:pd-c2 1.1s cubic-bezier(.22,1,.36,1) 700ms both}
@keyframes pd-c1{from{opacity:0;transform:translateY(60px) rotate(-14deg) scale(.9)}to{opacity:1;transform:rotate(-6deg)}}
@keyframes pd-c2{from{opacity:0;transform:translateY(60px) rotate(14deg) scale(.9)}to{opacity:1;transform:rotate(5deg)}}
.pd-title{animation:pd-t 900ms cubic-bezier(.22,1,.36,1) 1300ms both}
@keyframes pd-t{from{opacity:0;transform:translateY(20px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse 100% 45% at 50% 62%, #4A1E21 0%, #2E0D14 45%, #1D070E 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div class="pd-aura" style="position: absolute; left: -80px; top: 120px; width: 360px; height: 360px; border-radius: 50%; background: #9BBB8F; filter: blur(90px); opacity: .32"></div>
  <div class="pd-aura2" style="position: absolute; right: -100px; top: 300px; width: 380px; height: 380px; border-radius: 50%; background: #E39AA6; filter: blur(100px); opacity: .28"></div>

  <div style="position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 13px; font-weight: 600; color: #D3B5B5">Last balloon</div>

  <div style="position: absolute; left: 0; right: 0; top: 130px; height: 380px">
    <div class="pd-card2" style="position: absolute; left: 150px; top: 20px; width: 190px; height: 290px; border-radius: 20px; overflow: hidden; background: #30452E; box-shadow: 0 40px 80px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,0.14); transform: rotate(5deg)">
      <div style="position: absolute; left: -40px; top: 60px; width: 220px; height: 220px; border-radius: 50%; background: #9BBB8F; filter: blur(40px); opacity: .8"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(29,7,14,.8), rgba(29,7,14,0) 50%)"></div>
      <div style="position: absolute; left: 14px; bottom: 14px; font-size: 15px; font-weight: 600">Ben, 25</div>
    </div>
    <div class="pd-card1" style="position: absolute; left: 50px; top: 80px; width: 150px; height: 230px; border-radius: 18px; overflow: hidden; background: #5A2F3F; box-shadow: 0 30px 60px -24px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,0.14); transform: rotate(-6deg)">
      <div style="position: absolute; left: -30px; top: 40px; width: 180px; height: 180px; border-radius: 50%; background: #E39AA6; filter: blur(36px); opacity: .8"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(29,7,14,.8), rgba(29,7,14,0) 50%)"></div>
      <div style="position: absolute; left: 12px; bottom: 12px; font-size: 14px; font-weight: 600">Mia, 27</div>
    </div>
  </div>

  <div class="pd-title" style="position: absolute; left: 20px; right: 20px; top: 520px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 44px; line-height: 46px; letter-spacing: -0.02em">Mia chose Ben.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 22px; color: #D3B5B5">Out of five people, over four rounds, on a Monday. The chat is open and both of your answers are already in it.</p>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 6px">
    <a href="Chat.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #F6EAE6; color: #1D070E; font-size: 17px; font-weight: 600; text-decoration: none">Say something</a>
    <a href="Recap.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #D3B5B5; font-size: 15px; font-weight: 500; text-decoration: none">See the room recap</a>
  </div>
</div>
</body>
</html>
