<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Room found, your role</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-count{animation:pd-count 900ms cubic-bezier(.22,1,.36,1) 300ms both}
@keyframes pd-count{from{opacity:0;transform:scale(.7) translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.pd-seat{animation:pd-seat 700ms cubic-bezier(.34,1.4,.64,1) both}
.pd-seat:nth-child(1){animation-delay:.9s}.pd-seat:nth-child(2){animation-delay:1.0s}.pd-seat:nth-child(3){animation-delay:1.1s}.pd-seat:nth-child(4){animation-delay:1.2s}.pd-seat:nth-child(5){animation-delay:1.3s}.pd-seat:nth-child(6){animation-delay:1.45s}
@keyframes pd-seat{from{opacity:0;transform:translateY(24px) scale(.5)}to{opacity:1;transform:none}}
.pd-chooser{animation:pd-glow 2.8s ease-in-out infinite}
@keyframes pd-glow{0%,100%{box-shadow:0 0 0 2px #1D070E,0 0 0 4px #F6EAE6,0 0 24px rgba(246,234,230,.2)}50%{box-shadow:0 0 0 2px #1D070E,0 0 0 4px #F6EAE6,0 0 40px rgba(246,234,230,.5)}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse 100% 45% at 50% 62%, #4A1E21 0%, #2E0D14 45%, #1D070E 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 64px; display: flex; align-items: center; justify-content: space-between">

    <div style="font-size: 15px; color: #D3B5B5; width: 280px; line-height: 20px; margin-top: 8px">Tonight Mia picks. Give her a reason to keep you.</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 500px; height: 140px; border-radius: 22px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; gap: 18px">
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span class="pd-chooser" style="width: 42px; height: 42px; border-radius: 50%; background: #4A2F45; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 18px; color: #C08FB3">M</span><span style="font-size: 11px; font-weight: 600">Mia</span></div>
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="26" height="32" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbE2B566" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FFF3D6"/><stop offset=".42" stop-color="#E2B566"/><stop offset="1" stop-color="#6A4212"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbE2B566)"/><path d="M52 118h16l-8 12z" fill="#6A4212"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Nico</span></div>
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="26" height="32" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbDD6A60" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FFC9B6"/><stop offset=".42" stop-color="#DD6A60"/><stop offset="1" stop-color="#6E1A25"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbDD6A60)"/><path d="M52 118h16l-8 12z" fill="#6E1A25"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Noah</span></div>
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="26" height="32" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbE6A3A2" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FCE0D8"/><stop offset=".42" stop-color="#E6A3A2"/><stop offset="1" stop-color="#7C3341"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbE6A3A2)"/><path d="M52 118h16l-8 12z" fill="#7C3341"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Ben</span></div>
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="26" height="32" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vb8E1430" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#E57A8E"/><stop offset=".42" stop-color="#8E1430"/><stop offset="1" stop-color="#2E020B"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vb8E1430)"/><path d="M52 118h16l-8 12z" fill="#2E020B"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; color: #D3B5B5">Elias</span></div>
    <div class="pd-seat" style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="30" height="37" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; box-shadow: 0 0 0 2px #2B0D14, 0 0 0 4px #C21F35;"><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg><span style="font-size: 11px; font-weight: 600">You</span></div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 664px; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 14px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)">
    <div style="display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#D3B5B5" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 7v4a1 1 0 0 0 1 1h2l4 3V3L6 6H4a1 1 0 0 0-1 1z"></path><path d="M13 6a4 4 0 0 1 0 6"></path></svg><span style="font-size: 14px; color: #D3B5B5">Room sounds on</span></div>
    <span style="width: 44px; height: 26px; border-radius: 13px; background: #F6EAE6; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #1D070E"></span></span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-size: 13px; font-weight: 600; color: #D3B5B5">Round 1 starts in</div><a href="Round.html" style="font-family: 'Fraunces', serif; font-weight: 300; font-size: 56px; line-height: 56px; color: #F6EAE6; text-decoration: none; font-variant-numeric: tabular-nums">5</a></div>
  </div>
</div>
</body>
</html>
