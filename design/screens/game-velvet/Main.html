<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF9A8C}a:hover{color:#FFB3A8}
.pd-live{animation:pd-pulse 2.2s ease-in-out infinite}
@keyframes pd-pulse{0%,100%{box-shadow:0 0 0 0 rgba(127,201,160,.55)}60%{box-shadow:0 0 0 7px rgba(127,201,160,0)}}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}.pd-root > *:nth-child(2){animation-delay:110ms}.pd-root > *:nth-child(3){animation-delay:180ms}.pd-root > *:nth-child(4){animation-delay:250ms}.pd-root > *:nth-child(5){animation-delay:320ms}.pd-root > *:nth-child(6){animation-delay:390ms}.pd-root > *:nth-child(7){animation-delay:460ms}.pd-root > *:nth-child(8){animation-delay:530ms}.pd-root > *:nth-child(9){animation-delay:600ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both;animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #F6EAE6"],.pd-root button[style*="background: #F6EAE6"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4),0 14px 30px -12px rgba(246,234,230,.35)}
.pd-root a[href][style*="background: #F0695C"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -10px rgba(240,105,92,.6)}
.pd-glow{position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 62%,rgba(255,138,110,.16) 0%,rgba(255,138,110,0) 70%);animation:pd-breathe 7s ease-in-out infinite;z-index:0}
@keyframes pd-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pd-root > *:not(.pd-fx){position:relative}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse 100% 45% at 50% 62%, #4A1E21 0%, #2E0D14 45%, #1D070E 100%); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #F6EAE6; box-sizing: border-box">
  <div class="pd-fx pd-glow" aria-hidden="true"></div><svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.035;mix-blend-mode:overlay;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 64px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 600; font-size: 20px; letter-spacing: -0.01em"><span class="pd-wm" role="img" aria-label="Popdate" style="font-family: 'Gloock', Georgia, serif; font-weight: 400; letter-spacing: -0.03em; white-space: nowrap; line-height: 1">P<svg viewBox="0 0 120 220" aria-hidden="true" style="width: .52em; height: .953em; vertical-align: -.35em; margin: 0 .01em 0 .02em"><defs><radialGradient id="wmcrim" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 130c-6 20 10 34 2 52s-14 22-4 36" stroke="#E9BE72" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#wmcrim)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/></svg>pdate</span></div>
    <a href="Profile.html" aria-label="Your profile" style="width: 40px; height: 40px; border-radius: 50%; background: #5A2F3F; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 18px; color: #E39AA6; text-decoration: none">L</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 136px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #D3B5B5"><span class="pd-live" style="width: 8px; height: 8px; border-radius: 50%; background: #7FC9A0"></span>Zürich, Monday night</div>
    <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 44px; line-height: 46px; letter-spacing: -0.02em">Good evening,<br>Lasse.</h1>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 284px; height: 300px; border-radius: 22px; overflow: hidden; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)">
    <svg width="260" height="300" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; position: absolute; right: -60px; top: -40px; opacity: 0.9;"><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg>
    <div style="position: absolute; left: 22px; top: 22px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; color: #D3B5B5">In line right now</div>
      <div style="font-family: 'Fraunces', serif; font-weight: 300; font-size: 64px; line-height: 60px; letter-spacing: -0.03em">23</div>
      <div style="font-size: 14px; color: #D3B5B5">people near you</div>
    </div>
    <div style="position: absolute; left: 22px; bottom: 86px; display: flex; align-items: center; gap: 8px">
      <div style="display: flex">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #5A2F3F; box-shadow: 0 0 0 2px #2B0D14"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #5A4320; box-shadow: 0 0 0 2px #2B0D14; margin-left: -8px"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #2F4458; box-shadow: 0 0 0 2px #2B0D14; margin-left: -8px"></span>
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #30452E; box-shadow: 0 0 0 2px #2B0D14; margin-left: -8px"></span>
      </div>
      <span style="font-size: 13px; color: #D3B5B5">Rooms fill in about 40 seconds</span>
    </div>
    <a href="Queue.html" style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #F6EAE6; color: #1D070E; font-size: 17px; font-weight: 600; text-decoration: none">Get in line</a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 608px; display: flex; flex-direction: column; gap: 10px">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); text-decoration: none; color: #F6EAE6">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #3B141A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F6EAE6" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="6" r="3"></circle><path d="M1.5 15c0-3 2.5-5 5.5-5s5.5 2 5.5 5M13 7h4M15 5v4"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Bring a friend</span><span style="font-size: 13px; color: #D3B5B5">Reserve a balloon seat next to yours</span></div>
      </div>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#A98A8D" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 1l6 6-6 6"></path></svg>
    </a>
    <a href="Chat.html" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 14px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); text-decoration: none; color: #F6EAE6">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #4A2F45; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; color: #C08FB3">A</span>
        <div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">Alina, 22</span><span style="font-size: 13px; color: #D3B5B5">"Okay but the pizza argument..."</span></div>
      </div>
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #F0695C"></span>
    </a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; justify-content: space-around; padding: 8px 0; border-radius: 999px; background: #2B0D14; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08)">
    <a href="Main.html" aria-label="Home" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="12" height="15" viewBox="0 0 120 132" aria-hidden="true" style="display: inline-block; overflow: visible; "><defs><radialGradient id="vbC21F35" cx="34%" cy="26%" r="78%"><stop offset="0" stop-color="#FF9A92"/><stop offset=".42" stop-color="#C21F35"/><stop offset="1" stop-color="#4A030F"/></radialGradient></defs><path d="M60 7.5C31 7.5 12.5 30 12.5 58c0 32 25 57 42 61.5h11c17-4.5 42-29.5 42-61.5C107.5 30 89 7.5 60 7.5z" fill="url(#vbC21F35)"/><path d="M52 118h16l-8 12z" fill="#4A030F"/><ellipse cx="40" cy="36" rx="8" ry="15" transform="rotate(-28 40 36)" fill="#FFF3E6" opacity=".5"/><ellipse cx="88" cy="84" rx="4" ry="10" transform="rotate(30 88 84)" fill="#E9BE72" opacity=".22"/></svg></a>
    <a href="Chat.html" aria-label="Chats" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#A98A8D" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 4h14v9H8l-4 3v-3H3z"></path></svg></a>
    <a href="Settings.html" aria-label="Settings" style="width: 44px; height: 36px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#A98A8D" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="2.5"></circle><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"></path></svg></a>
  </div>
</div>
</body>
