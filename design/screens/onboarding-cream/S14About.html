<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>About you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5332A}a:hover{color:#8F281F}

.pd-root{isolation:isolate}
.pd-root > *{animation:pd-rise 760ms cubic-bezier(.22,1,.36,1) both}
.pd-root > *:nth-child(1){animation-delay:40ms}
.pd-root > *:nth-child(2){animation-delay:110ms}
.pd-root > *:nth-child(3){animation-delay:180ms}
.pd-root > *:nth-child(4){animation-delay:250ms}
.pd-root > *:nth-child(5){animation-delay:320ms}
.pd-root > *:nth-child(6){animation-delay:390ms}
.pd-root > *:nth-child(7){animation-delay:460ms}
.pd-root > *:nth-child(8){animation-delay:530ms}
.pd-root > .pd-fx{animation:none}
@keyframes pd-rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pd-root a[href],.pd-root button{transition:transform 180ms cubic-bezier(.22,1,.36,1),opacity 180ms,box-shadow 180ms;-webkit-tap-highlight-color:transparent}
.pd-root a[href]:active,.pd-root button:active{transform:scale(.97)}
.pd-root a[href]:hover,.pd-root button:hover{opacity:.92}
.pd-root svg[style*="top: 130px"],.pd-root svg[style*="top: 52px"]{animation:pd-float 5.2s ease-in-out infinite;transform-origin:50% 100%}
.pd-root [style*="transform-origin: top"]{animation:pd-sway 5.2s ease-in-out infinite}
@keyframes pd-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-9px) rotate(-1.5deg)}}
@keyframes pd-sway{0%,100%{transform:rotate(6deg)}50%{transform:rotate(3deg)}}
.pd-root [style*="height: 3px"]{transform-origin:left center;animation:pd-fill 600ms cubic-bezier(.22,1,.36,1) both}
.pd-root [style*="height: 3px"]:nth-child(n){animation-delay:calc(200ms + var(--i,0)*40ms)}
@keyframes pd-fill{from{transform:scaleX(.2);opacity:.4}to{transform:none;opacity:1}}
.pd-root [style*="filter: blur"]{animation:pd-drift 9s ease-in-out infinite alternate}
@keyframes pd-drift{to{transform:translate(8px,-10px) scale(1.04)}}
.pd-root input,.pd-root textarea{transition:box-shadow 200ms}
.pd-root input:focus,.pd-root textarea:focus{box-shadow:inset 0 0 0 2px currentColor !important}
@media (prefers-reduced-motion: reduce){.pd-root *{animation:none !important;transition:none !important}}

.pd-root a[href][style*="background: #1C1917"],.pd-root button[style*="background: #1C1917"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(28,25,23,.18),0 10px 24px -10px rgba(28,25,23,.45)}
.pd-root a[href][style*="background: #CF3A2F"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 12px 28px -10px rgba(207,58,47,.55)}
.pd-root [style*="background: #FFFDFA"][style*="border-radius: 20px"],.pd-root [style*="background: #FFFDFA"][style*="border-radius: 16px"]{box-shadow:inset 0 0 0 1px rgba(28,25,23,0.08),0 1px 0 rgba(255,255,255,.8),0 18px 40px -24px rgba(28,25,23,.35) !important}
</style>
<style>html,body{background:#0A0306;margin:0} body{display:flex;justify-content:center;padding:24px 0} .pd-root{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.6)}</style>
</head>
<body>
<div class="pd-root" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3E9DA; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #1C1917; box-sizing: border-box">
  <svg class="pd-fx pd-grain" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:multiply;z-index:5"><filter id="pdg"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#pdg)"></rect></svg>
  <div style="position: absolute; left: 20px; right: 20px; top: 60px; display: flex; gap: 4px">
    <span style="--i: 1; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 2; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 3; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 4; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 5; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 6; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 7; flex: 1; height: 3px; border-radius: 2px; background: #1C1917"></span>
    <span style="--i: 8; flex: 1; height: 3px; border-radius: 2px; background: #D6C9B3"></span>
    <span style="--i: 9; flex: 1; height: 3px; border-radius: 2px; background: #D6C9B3"></span>
    <span style="--i: 10; flex: 1; height: 3px; border-radius: 2px; background: #D6C9B3"></span>
  </div>
  <a href="S13PhotosFull.html" style="position: absolute; left: 20px; top: 80px; display: flex; align-items: center; gap: 4px; height: 44px; font-size: 15px; font-weight: 500; color: #1C1917; text-decoration: none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#1C1917" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"></path></svg>Back
  </a>

  <div style="position: absolute; left: 20px; right: 20px; top: 150px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Fraunces', 'New York', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 34px; letter-spacing: -0.015em">A few lines about you.</h1>
      <p style="margin: 0; font-size: 15px; line-height: 20px; color: #5F574F">Everything here is optional, except the bio. One good sentence beats a list.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="h" style="font-size: 13px; font-weight: 600; color: #5F574F">Height</label>
        <div style="display: flex; align-items: center; height: 52px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.18); background: #FFFDFA; padding: 0 16px; box-sizing: border-box">
          <input id="h" type="text" inputmode="numeric" value="183" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 17px; font-family: inherit; color: #1C1917; outline: none; padding: 0">
          <span style="font-size: 14px; color: #8C8378">cm</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="j" style="font-size: 13px; font-weight: 600; color: #5F574F">Job or school</label>
        <input id="j" type="text" value="Student" style="height: 52px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.18); background: #FFFDFA; padding: 0 16px; font-size: 17px; font-family: inherit; color: #1C1917; box-sizing: border-box; outline: none; width: 100%">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="bio" style="font-size: 13px; font-weight: 600; color: #5F574F">Bio</label>
      <textarea id="bio" rows="4" style="border-radius: 12px; border: 0; box-shadow: inset 0 0 0 2px #1C1917; background: #FFFDFA; padding: 14px 16px; font-size: 17px; line-height: 23px; font-family: inherit; color: #1C1917; box-sizing: border-box; outline: none; resize: none; width: 100%">Slow mornings, fast bikes, and a good argument about pizza.</textarea>
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8C8378"><span>Shown under your first photo.</span><span style="font-variant-numeric: tabular-nums">241 left</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 600; color: #5F574F">Add a detail</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFDFA; font-family: inherit; font-size: 14px; font-weight: 500">Cycling</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #E9DDC8; color: #1C1917; font-family: inherit; font-size: 14px; font-weight: 500">Cooking</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #1C1917; color: #FFFDFA; font-family: inherit; font-size: 14px; font-weight: 500">Live music</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #E9DDC8; color: #1C1917; font-family: inherit; font-size: 14px; font-weight: 500">Hiking</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #E9DDC8; color: #1C1917; font-family: inherit; font-size: 14px; font-weight: 500">Films</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #E9DDC8; color: #1C1917; font-family: inherit; font-size: 14px; font-weight: 500">Dogs</button>
        <button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFDFA; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.18); color: #5F574F; font-family: inherit; font-size: 14px; font-weight: 500">More</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="S15Questions.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #1C1917; color: #FFFDFA; font-size: 17px; font-weight: 600; text-decoration: none">Continue</a>
  </div>
</div>
</body>
</html>
