<!doctype html>
<html><head><meta charset="utf-8"><title>Popdate balloon - Mark</title>
<style>
  body{margin:0;background:#FFFDFE;color:#191919;font:13px/1.3 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;width:1200px}
  .row{display:flex;align-items:flex-end;gap:40px;padding:28px 48px;border-bottom:1px solid #eee4e8}
  .lab{font-size:11px;color:#8a7f84;letter-spacing:.04em;text-transform:uppercase;margin-top:8px;text-align:center}
  .cell{display:flex;flex-direction:column;align-items:center}
  .h{font-size:11px;color:#8a7f84;letter-spacing:.06em;text-transform:uppercase;width:90px;align-self:center}
  .logo{font:56px Georgia,serif;color:#191919;letter-spacing:-.5px;white-space:nowrap}
  .tile{width:160px;height:160px;border-radius:22%;background:#5D2355;display:flex;align-items:center;justify-content:center}
  .dots{display:flex;align-items:center;gap:7px}
  svg{display:block;overflow:visible}
  .inl{display:inline-block;vertical-align:baseline}
</style></head><body>
<div id="root"></div>
<script>
const BODY = "M10.1 23.9C5.9 21.6 3 17.4 3.2 12.2 3.4 6.2 7.6 2 13.2 2.2c5.2.2 8.1 4.2 7.7 9.2-.4 5.4-4.7 10.4-9.2 12.6zM6 12.4c.2-4.6 3-7.4 6.6-7.5-2.4.9-4.2 3.5-4.3 7.1 0 1.4-2.3 1.6-2.3.4z";
const HL   = "M6 12.4c.2-4.6 3-7.4 6.6-7.5-2.4.9-4.2 3.5-4.3 7.1 0 1.4-2.3 1.6-2.3.4z";
const KNOT = "M9.6 24.5l2.6.1.2 2.4-1.5-.9-1.7.7z";
const STR  = "M10.9 26.6c-.9 1.6 1 3 .1 4.8-.4.8-.3 1.5.1 2";
const SEATS = [["plum","#5D2355","#321030"],["gold","#E2B566","#6A4212"],["coral","#DD6A60","#6E1A25"],["blush","#E6A3A2","#7C3341"],["garnet","#8E1430","#2E020B"]];
const P = SEATS[0];

function parts(c,k,{str=true,op=1}={}){
  return `<g opacity="${op}"><path d="${BODY}" fill="${c}" fill-rule="evenodd"/><path d="${KNOT}" fill="${k}"/>${str?`<path d="${STR}" fill="none" stroke="${k}" stroke-width="1.1" stroke-linecap="round"/>`:''}</g>`;
}
function balloon(h,c,k,o={}){
  return `<svg viewBox="0 0 24 34" height="${h}" width="${(h*24/34).toFixed(1)}" ${o.cls?`class="${o.cls}" style="${o.style||''}"`:''}>${parts(c,k,o)}</svg>`;
}
const cell=(inner,lab)=>`<div class="cell">${inner}<div class="lab">${lab}</div></div>`;

// pop frames, viewBox centered on balloon with room for shards
const PV = `viewBox="-12 -7 48 48" width="100" height="100"`;
const C=P[1], K=P[2];
const poly=(pts,f)=>`<polygon points="${pts}" fill="${f}"/>`;
const f1 = parts(C,K);
const f2 = `<g transform="translate(12 13) scale(1.13 1.07) translate(-12 -13)"><path d="${BODY}" fill="${C}" fill-rule="evenodd"/><path d="${KNOT}" fill="${K}"/></g><path d="${STR}" transform="translate(0 1.2)" fill="none" stroke="${K}" stroke-width="1.1" stroke-linecap="round"/>`;
const f3 = [
  poly("2.6,3.6 7.8,6.6 5.0,8.8",C), poly("11.2,-3 14.4,2.6 10.4,3.4",C), poly("22,0 19.8,6.6 16.6,4.4",C),
  poly("27.2,11.4 21.4,13.6 21.8,9.6 25,8.8",C), poly("23.4,22.2 17.6,17.8 20.4,16.2",C),
  poly("0.6,17.8 5.8,14.4 6.6,18 2.6,20.2",C), poly("-3,9.2 3.2,10.6 0.4,13.2",C),
  poly("6.8,22.6 9.2,17.4 11,20.8",C), poly("16.6,-1.6 18.4,1.4 15.6,2.2",K), poly("25.6,4.2 23.6,7.2 22.2,5.2",K),
  poly("-1.4,2.2 2,3.8 -0.2,5.2",K),
  `<g transform="translate(0 1.4) rotate(-6 11 25)"><path d="${KNOT}" fill="${K}"/><path d="${STR}" fill="none" stroke="${K}" stroke-width="1.1" stroke-linecap="round"/></g>`
].join('');
const f4 = [
  `<g transform="rotate(18 6 22)">${poly("3,20 7.6,21 6.2,23.4 2.2,22.6",C)}</g>`,
  `<g transform="rotate(-24 18 25)">${poly("15.4,24.4 20.6,23.6 19.4,26.4",C)}</g>`,
  `<g transform="rotate(40 4 31)">${poly("2,30 6.4,30.6 4.2,32.6",C)}</g>`,
  `<g transform="rotate(-10 21 33)">${poly("19,32 23.4,31.4 22.6,34.2 19.8,34.4",C)}</g>`,
  poly("9.2,16 11.8,17.4 9.6,18.6",K), poly("23.2,17.4 25.4,19 23,20",C),
  `<g transform="translate(1.2 9.5) rotate(22 11 25)"><path d="${KNOT}" fill="${K}"/><path d="${STR}" fill="none" stroke="${K}" stroke-width="1.1" stroke-linecap="round"/></g>`
].join('');
const SCRAP = "M9.6 24.4C8.4 22.8 6.9 21.6 5.8 20.1l1.8-.5-.3-1.9 2.2 1-.1-2.3 1.7 1.9 1.2-2.1.7 2.2 1.9-.8-.4 2.1 2 .2c-1.3 1.6-2.6 2.9-3.2 4.5z";
const f5 = `<g transform="translate(1 8) rotate(-28 11 25)"><path d="${SCRAP}" fill="${C}"/><path d="${KNOT}" fill="${K}"/><path d="${STR}" fill="none" stroke="${K}" stroke-width="1.1" stroke-linecap="round"/></g>`;

// loader: inflating, body scaled from the neck
const load=s=>`<svg viewBox="0 0 24 34" height="32" width="${(32*24/34).toFixed(1)}"><g transform="translate(10.9 24.2) scale(${s}) translate(-10.9 -24.2)"><path d="${BODY}" fill="${C}" fill-rule="evenodd"/></g><path d="${KNOT}" fill="${K}"/><path d="${STR}" fill="none" stroke="${K}" stroke-width="1.1" stroke-linecap="round"/></svg>`;

const lh = 56*1.38; // logo balloon height so body sits between x-height and cap height
const logoB = `<svg class="inl" viewBox="0 0 24 34" height="${(34*56*0.0246).toFixed(1)}" width="${(24*56*0.0246).toFixed(1)}" style="vertical-align:${(-(34-27)*56*0.0246).toFixed(1)}px;margin-left:1px">${parts(C,K)}</svg>`;

document.getElementById('root').innerHTML = `
<div class="row">
  <div class="h">Balloon</div>
  ${cell(balloon(240,C,K),'plum 240')}
  <div style="display:flex;gap:26px;align-items:flex-end">${SEATS.map(s=>cell(balloon(72,s[1],s[2]),s[0]+' 72')).join('')}</div>
  <div style="display:flex;gap:22px;align-items:flex-end">${[24,14,10].map(h=>cell(balloon(h,C,K),h)).join('')}</div>
</div>
<div class="row" style="align-items:center">
  <div class="h">Logo</div>
  <div class="cell"><div class="logo">Popdate${logoB}</div><div class="lab">Georgia 56, balloon as the full stop</div></div>
  <div style="flex:1"></div>
  ${cell(`<div class="tile">${balloon(118,'#FFFDFE','#FFFDFE')}</div>`,'app icon 160, one color, cutout shows the tile')}
</div>
<div class="row" style="align-items:center">
  <div class="h">Progress / loader</div>
  ${cell(`<div class="dots">${[1,1,0,0].map((on,i)=>balloon(14,C,K,{str:false,op:on?1:.22})).join('')}<span style="margin-left:8px;font-size:13px">round 2 of 4</span></div>`,'dots 14')}
  <div style="width:60px"></div>
  ${[.5,.76,1].map((s,i)=>cell(load(s),'loader '+(i+1))).join('')}
</div>
<div class="row" style="border:0">
  <div class="h">Pop</div>
  ${[[f1,'1 still'],[f2,'2 swell'],[f3,'3 burst'],[f4,'4 shreds fall'],[f5,'5 popped']].map(([g,l])=>cell(`<svg ${PV}>${g}</svg>`,l)).join('')}
</div>`;
</script>
</body></html>
